<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Page - Status Utility</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased">
  <div data-surface-id="SURF_STATUS_PAGE" data-route="/status" class="flex-1 flex flex-col justify-between">
    <!-- Top Bar -->
    <header class="w-full border-b border-slate-200 bg-white px-6 py-4 flex items-center justify-between shadow-sm">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-sm">
          SU
        </div>
        <div>
          <h1 class="text-base font-semibold leading-none text-slate-800">Status Utility</h1>
          <p class="text-xs text-slate-500 mt-1">System Monitoring &amp; State Diagnostics</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
          Route: /status
        </span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex items-center justify-center p-6">
      <div class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center flex flex-col items-center">
        <!-- Status Indicator Icon -->
        <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center mb-4 text-emerald-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>

        <h2 class="text-2xl font-bold text-slate-800 mb-2">System Status Dashboard</h2>
        <p class="text-sm text-slate-500 mb-6 max-w-sm">Inspect and refresh current runtime application readiness</p>

        <!-- Status Readout Surface -->
        <div data-surface-id="SURF_STATUS_READOUT" value="refreshed" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-6 mb-8 text-center">
          <span class="block text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1">Current State</span>
          <div class="text-2xl font-bold text-emerald-600">Status refreshed</div>
          <div class="mt-2 text-xs font-mono text-slate-500">Value: refreshed</div>
        </div>

        <!-- Single Authorized Action Control Slot -->
        <button type="button" data-action="ACT_REFRESH_STATUS" data-control-slot="CSLOT_REFRESH_STATUS_REFRESH_BUTTON" class="w-full sm:w-auto px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">Refresh</button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-400">
      Status Utility &mdash; Active route /status
    </footer>
  </div>
</body>
</html>
